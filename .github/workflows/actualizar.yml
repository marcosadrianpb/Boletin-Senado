name: Boletin - Actualizar padron y publicar

on:
  workflow_dispatch:
    inputs:
      anios:
        description: "Anios de expediente separados por espacio (vacio = el que corre)"
        default: ""
      sin_enriquecer:
        description: "No consultar la ficha de cada expediente nuevo"
        type: boolean
        default: false
      sin_issue:
        description: "No abrir el issue con el boletin"
        type: boolean
        default: false
  schedule:
    # 7:23 de Buenos Aires (UTC-3), de lunes a viernes.
    # El minuto no es redondo a proposito: GitHub demora los workflows
    # programados cuando tiene carga, y la hora en punto es el peor momento.
    # Con "0 11" las corridas llegaron a salir seis horas tarde. Los 37 minutos
    # de adelanto son margen para que igual caiga cerca de las 8.
    - cron: "23 10 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: padron
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Para el panel por bloque. Se baja una vez por semana: los bloques
      # cambian, pero no todos los dias.
      - name: Padron de senadores
        run: python -m src.senadores --si-viejo 7

      - name: Actualizar padron
        run: |
          ARGS=""
          if [ -n "${{ inputs.anios }}" ]; then ARGS="--anios ${{ inputs.anios }}"; fi
          if [ "${{ inputs.sin_enriquecer }}" = "true" ]; then ARGS="$ARGS --sin-enriquecer"; fi
          python -m src.actualizar $ARGS --resumen "$GITHUB_STEP_SUMMARY"

      # Los dias sin altas ni cambios no arman boletin: no se abre issue.
      - name: Armar boletin
        id: boletin
        run: |
          python -m src.boletin --cuerpo-issue "$RUNNER_TEMP/issue.md" \
                               --resumen "$GITHUB_STEP_SUMMARY"

      - name: Guardar en el repo
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A datos
          git diff --staged --quiet || git commit -m "Padron del $(TZ=America/Argentina/Buenos_Aires date +%F)"
          git pull --rebase
          git push

      # Si el dia ya tiene issue, se actualiza. Un dia con dos corridas es un
      # solo boletin, no dos: el archivo de novedades ya viene acumulado.
      - name: Abrir o actualizar el issue del dia
        if: success() && steps.boletin.outputs.hay == 'true' && inputs.sin_issue != true
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.boletin.outputs.titulo }}
          CUERPO: ${{ steps.boletin.outputs.cuerpo }}
          PREFIJO: ${{ steps.boletin.outputs.prefijo }}
        run: |
          gh label create boletin --color 0E8A16 --description "Boletin diario" --force
          # Se lista por etiqueta y no con --search: la busqueda de GitHub tarda
          # en indexar y un issue recien creado no aparece.
          NUM=$(gh issue list --label boletin --state all --limit 50 \
                  --json number,title \
                  --jq '[.[] | select(.title | startswith(env.PREFIJO))] | .[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITULO" --body-file "$CUERPO"
            echo "actualizado el issue #$NUM"
          else
            gh issue create --title "$TITULO" --body-file "$CUERPO" --label boletin
          fi

      # No hace nada hasta que exista la variable BREVO_LISTA con el id de la
      # lista. Mientras BREVO_ENVIAR no diga "true", la campana se crea y queda
      # en borrador: hay que entrar a Brevo y mandarla a mano.
      - name: Mandar el boletin por mail
        if: success() && steps.boletin.outputs.hay == 'true' && vars.BREVO_LISTA != ''
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          LISTAS: ${{ vars.BREVO_LISTA }}
          ENVIAR: ${{ vars.BREVO_ENVIAR }}
        run: |
          ARGS=""
          for id in $LISTAS; do ARGS="$ARGS --lista $id"; done
          if [ "$ENVIAR" = "true" ]; then ARGS="$ARGS --mandar"; fi
          python -m src.envio $ARGS

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: padron
          path: datos/
          if-no-files-found: warn
