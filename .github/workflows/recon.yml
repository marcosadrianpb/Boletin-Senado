name: Fase 0 - Reconocimiento

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          pip install playwright==1.47.0
          playwright install --with-deps chromium

      - name: Reconocer el sitio
        continue-on-error: true
        run: |
          cat > r2.py <<'PY'
          import json, re, traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE = "https://www.senado.gob.ar"
          BUSC = BASE + "/parlamentario/parlamentaria/"
          ASUN = BASE + "/parlamentario/sesiones/asuntosEnt"
          OUT = Path("recon"); OUT.mkdir(exist_ok=True)
          L = []
          def w(s=""): L.append(s)

          RUIDO = re.compile(r"^(gs[_-]|gsc|___gcse|q$)", re.I)

          DUMP = """() => {
            const t = e => (e?.innerText||e?.value||'').trim().replace(/\\s+/g,' ').slice(0,90);
            return {
              titulo: document.title,
              url: location.href,
              campos: [...document.querySelectorAll('input,select,textarea')].map(c=>({
                tag: c.tagName.toLowerCase(),
                type: c.getAttribute('type')||'',
                name: c.getAttribute('name')||'',
                id: c.id||'',
                ph: c.getAttribute('placeholder')||'',
                vis: !!(c.offsetWidth||c.offsetHeight),
                pane: (c.closest('.tab-pane,[role=tabpanel]')||{}).id || '',
                form: (c.closest('form')||{}).id || '',
                op: c.options ? [...c.options].slice(0,6).map(o=>o.value+'='+o.text.trim().slice(0,30)) : null
              })),
              forms: [...document.querySelectorAll('form')].map(f=>({
                id: f.id||'', name: f.getAttribute('name')||'',
                action: f.getAttribute('action')||'', method: (f.getAttribute('method')||'GET').toUpperCase()
              })),
              tabs: [...document.querySelectorAll('[data-toggle=tab],[role=tab],.nav-tabs a,.nav-pills a,ul.nav a')]
                .map(a=>({txt:t(a), href:a.getAttribute('href')||'', target:a.getAttribute('data-target')||''})),
              botones: [...document.querySelectorAll('button,input[type=submit],input[type=button],a.btn')]
                .map(b=>({txt:t(b), id:b.id||'', type:b.getAttribute('type')||'',
                          onclick:(b.getAttribute('onclick')||'').slice(0,120)})),
              exportar: [...document.querySelectorAll('a,button')].filter(e=>
                /datos abiertos|excel|xlsx|csv|json|descargar|export|download/i.test(t(e)+' '+(e.getAttribute('href')||''))
                ).map(e=>({txt:t(e), href:e.getAttribute('href')||'',
                           onclick:(e.getAttribute('onclick')||'').slice(0,150)}))
            }}"""


          def util(c):
              return not (RUIDO.match(c["id"] or "") or RUIDO.match(c["name"] or ""))


          def volcar(page, nombre, url, red):
              w(f"## {nombre}")
              w()
              try:
                  r = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(4000)
                  d = page.evaluate(DUMP)
                  w(f"- HTTP: {r.status if r else '?'} | url final: `{page.url}`")
                  w(f"- titulo: {d['titulo']}")
                  w()
                  w("### Formularios")
                  for f in d["forms"]:
                      w(f"- id=`{f['id']}` name=`{f['name']}` **{f['method']}** action=`{f['action']}`")
                  w()
                  w("### Pestanas")
                  for a in d["tabs"][:40]:
                      if a["txt"]:
                          w(f"- `{a['txt']}` -> href=`{a['href']}` target=`{a['target']}`")
                  w()
                  cs = [c for c in d["campos"] if util(c)]
                  w(f"### Campos utiles ({len(cs)} de {len(d['campos'])} totales)")
                  w()
                  w("| tag | type | name | id | placeholder | visible | panel | form |")
                  w("|---|---|---|---|---|---|---|---|")
                  for c in cs[:90]:
                      w(f"| {c['tag']} | {c['type']} | `{c['name']}` | `{c['id']}` | {c['ph']} "
                        f"| {'SI' if c['vis'] else 'no'} | {c['pane']} | {c['form']} |")
                  w()
                  w("### Opciones de los select")
                  for c in cs:
                      if c["op"]:
                          w(f"- `{c['name'] or c['id']}`: {c['op']}")
                  w()
                  w("### Botones")
                  for b in d["botones"][:40]:
                      if b["txt"] or b["onclick"]:
                          w(f"- `{b['txt']}` id=`{b['id']}` type={b['type']} onclick=`{b['onclick']}`")
                  w()
                  w("### Enlaces de exportacion / descarga")
                  for e in d["exportar"][:40]:
                      w(f"- `{e['txt']}` -> `{e['href']}` onclick=`{e['onclick']}`")
                  w()
                  (OUT / f"{nombre}.html").write_text(page.content(), encoding="utf-8")
                  (OUT / f"{nombre}.json").write_text(json.dumps(d, indent=1, ensure_ascii=False),
                                                      encoding="utf-8")
                  return d
              except Exception as e:
                  w(f"**ERROR:** `{type(e).__name__}: {e}`")
                  w("```")
                  w(traceback.format_exc()[-800:])
                  w("```")
                  w()
                  return None


          red = []
          with sync_playwright() as pw:
              br = pw.chromium.launch()
              ctx = br.new_context(locale="es-AR", timezone_id="America/Argentina/Buenos_Aires",
                                   viewport={"width": 1500, "height": 1100})
              ctx.set_default_timeout(45000)
              ctx.route(re.compile(r"(google-analytics|googletagmanager|adtrafficquality|doubleclick"
                                   r"|googlesyndication|cse\.google)"), lambda r: r.abort())

              pg = ctx.new_page()
              pg.on("response", lambda r: red.append(
                  (r.request.method, r.url[:300], r.status, r.headers.get("content-type", "")[:50],
                   (r.request.post_data or "")[:400]))
                  if "senado.gob.ar" in r.url and r.request.resource_type in ("document", "xhr", "fetch")
                  else None)

              w("# Fase 0 - Reconocimiento (v2)")
              w()
              d1 = volcar(pg, "buscador", BUSC, red)

              # Activar cada pestana y ver que campos se vuelven visibles
              w("## Campos que aparecen al activar cada pestana")
              w()
              try:
                  tabs = pg.locator(".nav-tabs a, [data-toggle=tab], [role=tab]")
                  n = min(tabs.count(), 10)
                  w(f"pestanas encontradas: {tabs.count()}")
                  w()
                  for i in range(n):
                      try:
                          tt = tabs.nth(i).inner_text().strip()[:40]
                          tabs.nth(i).click(timeout=8000)
                          pg.wait_for_timeout(1200)
                          vis = pg.evaluate("""() => [...document.querySelectorAll('input,select')]
                              .filter(c=>(c.offsetWidth||c.offsetHeight))
                              .map(c=>(c.getAttribute('name')||'')+'|'+(c.id||'')+'|'
                                      +(c.getAttribute('type')||'')+'|'+(c.getAttribute('placeholder')||''))
                              .filter(s=>!/^gs|gsc|___gcse/i.test(s))""")
                          w(f"### Pestana {i}: {tt}")
                          for v in vis[:25]:
                              w(f"- `{v}`")
                          w()
                      except Exception as e:
                          w(f"### Pestana {i}: fallo -> {str(e)[:120]}")
                          w()
              except Exception as e:
                  w(f"**ERROR pestanas:** {str(e)[:200]}")
                  w()

              d2 = volcar(pg, "asuntos_entrados", ASUN, red)
              br.close()

          w("## Peticiones a senado.gob.ar")
          w()
          vistos = set()
          for m, u, st, ct, pd in red:
              if (m, u) in vistos:
                  continue
              vistos.add((m, u))
              w(f"- `{m} {u}` -> {st} ({ct})")
              if pd:
                  w(f"  - envia: `{pd}`")

          txt = "\n".join(L)
          Path("INFORME.md").write_text(txt, encoding="utf-8")
          (OUT / "INFORME.md").write_text(txt, encoding="utf-8")
          print(txt)
          PY
          python r2.py

      - name: Mostrar informe
        if: always()
        run: cat INFORME.md >> "$GITHUB_STEP_SUMMARY" || echo sin-informe >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A recon INFORME.md || true
          git diff --staged --quiet || git commit -m "Resultados del reconocimiento"
          git push || true

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconocimiento
          path: recon/
          if-no-files-found: warn
