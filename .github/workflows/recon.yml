name: Fase 0 - Reconocimiento

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          pip install playwright==1.47.0
          playwright install --with-deps chromium

      - name: Reconocer el sitio
        continue-on-error: true
        run: |
          cat > r3.py <<'PY'
          import json, re, traceback
          from datetime import date, timedelta
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE = "https://www.senado.gob.ar"
          BUSC = BASE + "/parlamentario/parlamentaria/"
          OUT = Path("recon"); OUT.mkdir(exist_ok=True)
          L = []
          def w(s=""): L.append(s)

          HASTA = date.today()
          DESDE = HASTA - timedelta(days=45)

          PONER = """(a) => {
            const f = [...document.querySelectorAll('form')]
              .find(x => (x.getAttribute('action')||'').includes(a.ep));
            if (!f) return 'SIN FORMULARIO';
            const out = [];
            for (const [n, v] of a.vals) {
              const e = f.querySelector('[name="' + n + '"]');
              if (!e) { out.push(n + ':NO-EXISTE'); continue; }
              e.value = v;
              out.push(n.replace('busqueda_proyectos','bp') + '=' + e.value);
            }
            f.submit();
            return out.join(' | ');
          }"""

          VOLCAR = """() => {
            const t = e => (e?.innerText||'').trim().replace(/\\s+/g,' ').slice(0,120);
            return {
              url: location.href,
              titulo: document.title,
              tablas: [...document.querySelectorAll('table')].map(x=>({
                id: x.id||'', clase: (x.className||'').slice(0,60),
                cols: [...x.querySelectorAll('thead th, tr:first-child th')].map(t),
                nfilas: x.querySelectorAll('tbody tr').length || x.querySelectorAll('tr').length,
                filas: [...x.querySelectorAll('tbody tr')].slice(0,3)
                  .map(tr=>[...tr.querySelectorAll('td')].map(t))
              })),
              links_proyecto: [...document.querySelectorAll('a')]
                .map(a=>a.getAttribute('href')||'')
                .filter(h=>/parlamentaria|expediente|proyecto|Downl|\\.pdf/i.test(h))
                .slice(0,15),
              paginacion: [...document.querySelectorAll('.pagination a, [class*=pagina] a')]
                .slice(0,12).map(a=>({txt:t(a), href:a.getAttribute('href')||''})),
              texto: document.body.innerText.replace(/\\n{2,}/g,'\\n').slice(0,2500)
            }}"""


          def sel(nombre, d):
              return [(f"busqueda_proyectos[{nombre}][day]", str(d.day)),
                      (f"busqueda_proyectos[{nombre}][month]", str(d.month)),
                      (f"busqueda_proyectos[{nombre}][year]", str(d.year))]


          def probar(pg, etiqueta, ep, campos):
              w(f"## {etiqueta}  (POST /{ep})")
              w()
              w(f"rango consultado: {DESDE} a {HASTA}")
              w()
              try:
                  pg.goto(BUSC, wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(2500)
                  res = pg.evaluate(PONER, {"ep": ep, "vals": campos})
                  w(f"- campos seteados: `{res}`")
                  if res == "SIN FORMULARIO":
                      w()
                      return
                  try:
                      pg.wait_for_load_state("domcontentloaded", timeout=45000)
                  except Exception:
                      pass
                  pg.wait_for_timeout(6000)
                  d = pg.evaluate(VOLCAR)
                  w(f"- url resultado: `{d['url']}`")
                  w()
                  for i, tb in enumerate(d["tablas"]):
                      if not tb["nfilas"]:
                          continue
                      w(f"### tabla {i}: id=`{tb['id']}` clase=`{tb['clase']}` ({tb['nfilas']} filas)")
                      w(f"- columnas: {tb['cols']}")
                      for fila in tb["filas"]:
                          w(f"- fila: {fila}")
                      w()
                  w(f"- paginacion: {d['paginacion']}")
                  w(f"- links tipo proyecto: {d['links_proyecto']}")
                  w()
                  w("texto de la pagina:")
                  w("```")
                  w(d["texto"])
                  w("```")
                  w()
                  (OUT / f"res_{ep}.html").write_text(pg.content(), encoding="utf-8")
                  (OUT / f"res_{ep}.json").write_text(json.dumps(d, indent=1, ensure_ascii=False),
                                                      encoding="utf-8")
              except Exception as e:
                  w(f"**ERROR:** `{type(e).__name__}: {e}`")
                  w("```")
                  w(traceback.format_exc()[-700:])
                  w("```")
                  w()


          w("# Fase 0 - Reconocimiento (v3): busquedas reales")
          w()

          with sync_playwright() as pw:
              br = pw.chromium.launch()
              ctx = br.new_context(locale="es-AR", timezone_id="America/Argentina/Buenos_Aires",
                                   viewport={"width": 1500, "height": 1100})
              ctx.set_default_timeout(45000)
              ctx.route(re.compile(r"(google-analytics|googletagmanager|adtrafficquality|doubleclick"
                                   r"|googlesyndication|cse\.google|sharethis)"), lambda r: r.abort())
              pg = ctx.new_page()

              probar(pg, "A. Fecha de Mesa de Entradas", "fechaMesa",
                     sel("fechaDesdeMesa", DESDE) + sel("fechaHastaMesa", HASTA))

              probar(pg, "B. Busqueda avanzada por fecha", "avanzada",
                     sel("fechaDesde", DESDE) + sel("fechaHasta", HASTA))

              w("## C. Endpoints de datos abiertos")
              w()
              for nombre, url in [
                  ("asuntos entrados JSON", BASE + "/micrositios/DatosAbiertos/ExportarListadoAsuntosEntrados/json"),
                  ("asuntos entrados Excel", BASE + "/micrositios/DatosAbiertos/ExportarListadoAsuntosEntrados/Excel"),
              ]:
                  try:
                      r = ctx.request.get(url, timeout=45000)
                      cuerpo = r.body()
                      w(f"- **{nombre}**: HTTP {r.status} | {r.headers.get('content-type','?')} "
                        f"| {len(cuerpo)} bytes")
                      if "json" in (r.headers.get("content-type", "") + url).lower():
                          muestra = cuerpo.decode("utf-8", "replace")[:1800]
                          w("```")
                          w(muestra)
                          w("```")
                          (OUT / "asuntos_entrados.json").write_bytes(cuerpo)
                  except Exception as e:
                      w(f"- **{nombre}**: ERROR {str(e)[:200]}")
                  w()

              w("## D. DAE Digital")
              w()
              try:
                  pg.goto(BASE + "/parlamentario/DAEDIGITAL/", wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(4000)
                  d = pg.evaluate(VOLCAR)
                  w(f"- url: `{d['url']}` | titulo: {d['titulo']}")
                  for i, tb in enumerate(d["tablas"]):
                      if tb["nfilas"]:
                          w(f"- tabla {i} id=`{tb['id']}` ({tb['nfilas']} filas) cols={tb['cols']}")
                          for fila in tb["filas"]:
                              w(f"  - {fila}")
                  w(f"- links: {d['links_proyecto']}")
                  w()
                  w("```")
                  w(d["texto"][:1500])
                  w("```")
                  (OUT / "dae.html").write_text(pg.content(), encoding="utf-8")
              except Exception as e:
                  w(f"**ERROR:** {str(e)[:250]}")
              w()

              br.close()

          txt = "\n".join(L)
          Path("INFORME.md").write_text(txt, encoding="utf-8")
          (OUT / "INFORME.md").write_text(txt, encoding="utf-8")
          print(txt)
          PY
          python r3.py

      - name: Mostrar informe
        if: always()
        run: cat INFORME.md >> "$GITHUB_STEP_SUMMARY" || echo sin-informe >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A recon INFORME.md || true
          git diff --staged --quiet || git commit -m "Resultados del reconocimiento v3"
          git push || true

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconocimiento
          path: recon/
          if-no-files-found: warn
